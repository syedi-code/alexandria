# Checks never deploy. Deploys never gate a PR.
name: Checks

on:
    pull_request:
        branches: [main, staging]
    push:
        branches: [main, staging]

concurrency:
    group: checks-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Lint, typecheck, test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - run: npm ci

            # Includes the works/writing boundary rule, which is the only thing
            # holding the seam — nothing fails at runtime when it is crossed.
            - run: npm run lint

            # CONTRIBUTING tells a contributor to run `npm run format`. Without
            # this, drift accumulates and that command rewrites files nobody
            # touched, burying their diff.
            - run: npx prettier --check .

            - run: npx tsc -b

            - run: npm test
